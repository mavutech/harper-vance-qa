name: Deploy Firebase Hosting from Main

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

concurrency:
  group: firebase-hosting-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test Harper Vance frontend
        run: yarn test --runInBand --watchAll=false --watchman=false
        env:
          CI: true

      - name: Build Harper Vance frontend
        run: yarn build
        env:
          CI: false

      - name: Verify production bundle budget
        run: yarn check:bundle

      - name: Install Chromium for browser checks
        run: yarn playwright install --with-deps chromium

      - name: Test customer-facing browser journeys
        run: yarn test:e2e
        env:
          CI: true

      - name: Deploy Harper Vance frontend to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          channelId: live
          entryPoint: .
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOLDENSETUPS_DEV }}
          projectId: goldensetups-dev

      - name: Test deployed production journeys
        run: |
          test "$PRODUCTION_BASE_URL" = "https://www.harpervanceqa.com"
          yarn test:e2e
        env:
          CI: true
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

      - name: Verify production hostnames
        run: |
          for origin in https://www.harpervanceqa.com https://harpervanceqa.com
          do
            curl --fail --location --silent --show-error "$origin" \
              | grep -q "Harper Vance Quantitative Analysis"
          done

      - name: Preserve browser-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-browser-test-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
