name: Deploy Harper Vance QA Hosting from Main

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

concurrency:
  group: firebase-hosting-main
  cancel-in-progress: false

env:
  FIREBASE_HOSTING_ORIGIN: https://harpervance.com
  FIREBASE_HOSTING_FALLBACK_ORIGIN: https://harpervanceqa-dev.web.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test Harper Vance frontend
        run: yarn test --runInBand --watchAll=false --watchman=false
        env:
          CI: true

      - name: Build Harper Vance frontend
        run: yarn build
        env:
          CI: false

      - name: Confirm the production bundle targets Harper Vance QA
        run: |
          grep -q 'REACT_APP_FIREBASE_PROJECT_ID:"harpervanceqa-dev"' build/static/js/main.*.js
          if grep -q 'goldensetups-dev' build/static/js/main.*.js; then
            echo "::error::The frontend bundle still references the retired Golden Setups project."
            exit 1
          fi

      - name: Verify production bundle budget
        run: yarn check:bundle

      - name: Install Chromium for browser checks
        run: yarn playwright install --with-deps chromium

      - name: Test customer-facing browser journeys
        run: yarn test:e2e
        env:
          CI: true

      - name: Test authenticated licensed-customer journey before deployment
        run: yarn test:e2e:authenticated
        env:
          CI: true
          E2E_BROWSER_PASSWORD: ${{ secrets.E2E_BROWSER_PASSWORD }}
          E2E_BROWSER_TOTP_SECRET: ${{ secrets.E2E_BROWSER_TOTP_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ env.FIREBASE_HOSTING_FALLBACK_ORIGIN }}

      - name: Verify Firebase Hosting provider availability
        run: |
          set -o pipefail
          curl --fail --location --silent --show-error --max-time 20 \
            "$FIREBASE_HOSTING_FALLBACK_ORIGIN" \
            | grep -q "Harper Vance Quantitative Analysis"

      - name: Deploy Harper Vance frontend to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          channelId: live
          entryPoint: .
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARPERVANCEQA_DEV }}
          projectId: harpervanceqa-dev

      - name: Test deployed production customer journeys
        run: |
          yarn test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ env.FIREBASE_HOSTING_ORIGIN }}

      - name: Test deployed production authenticated licensed-customer journey
        run: yarn test:e2e:authenticated
        env:
          CI: true
          E2E_BROWSER_PASSWORD: ${{ secrets.E2E_BROWSER_PASSWORD }}
          E2E_BROWSER_TOTP_SECRET: ${{ secrets.E2E_BROWSER_TOTP_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ env.FIREBASE_HOSTING_ORIGIN }}

      - name: Verify Harper Vance production Hosting URL
        run: |
          curl --fail --location --silent --show-error "$FIREBASE_HOSTING_ORIGIN" \
            | grep -q "Harper Vance Quantitative Analysis"

      - name: Verify Firebase fallback Hosting URL
        run: |
          curl --fail --location --silent --show-error "$FIREBASE_HOSTING_FALLBACK_ORIGIN" \
            | grep -q "Harper Vance Quantitative Analysis"

      - name: Preserve browser-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-browser-test-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
