name: Harper Vance QA Firebase Hosting Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FIREBASE_HOSTING_ORIGIN: https://harpervanceqa-dev.web.app

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test Harper Vance frontend
        run: yarn test --runInBand --watchAll=false --watchman=false
        env:
          CI: true

      - name: Build Harper Vance frontend
        run: yarn build
        env:
          CI: false

      - name: Confirm the preview bundle targets Harper Vance QA
        run: |
          grep -q 'REACT_APP_FIREBASE_PROJECT_ID:"harpervanceqa-dev"' build/static/js/main.*.js
          if grep -q 'goldensetups-dev' build/static/js/main.*.js; then
            echo "::error::The frontend bundle still references the retired Golden Setups project."
            exit 1
          fi

      - name: Verify production bundle budget
        run: yarn check:bundle

      - name: Verify Firebase Hosting provider availability
        run: |
          set -o pipefail
          curl --fail --location --silent --show-error --max-time 20 \
            "$FIREBASE_HOSTING_ORIGIN" \
            | grep -q "Harper Vance Quantitative Analysis"

      - name: Deploy Firebase preview
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          disableComment: true
          entryPoint: .
          expires: 30d
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARPERVANCEQA_DEV }}
          projectId: harpervanceqa-dev
          repoToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium for browser checks
        run: yarn playwright install --with-deps chromium

      - name: Test deployed Firebase preview
        run: |
          test -n "$PLAYWRIGHT_BASE_URL"
          yarn test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.firebase_preview.outputs.details_url }}

      - name: Preserve browser-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-preview-browser-test-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Add preview URL to pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.details_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const start = '<!-- firebase-preview:start -->';
            const end = '<!-- firebase-preview:end -->';
            const previewUrl = process.env.PREVIEW_URL;
            const section = [
              start,
              '## Firebase Preview',
              '',
              `[Open this PR's Firebase preview](${previewUrl})`,
              '',
              '_Built from this PR and updated automatically after every push._',
              end,
            ].join('\n');
            const body = context.payload.pull_request.body || '';
            const startIndex = body.indexOf(start);
            const endIndex = body.indexOf(end);
            const nextBody = startIndex >= 0 && endIndex >= startIndex
              ? [
                  body.slice(0, startIndex).trimEnd(),
                  section,
                  body.slice(endIndex + end.length).trimStart(),
                ].filter(Boolean).join('\n\n')
              : `${body.trim()}\n\n${section}`.trim();
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: nextBody,
            });
